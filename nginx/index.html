<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to User Management Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #6e5945 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #f8fafc;
    }
    .card {
      background: rgba(184, 158, 106);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 500px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      background: #6e5945;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #38bdf8; }
    button {
      padding: 12px 20px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #0369a1; }
    button:active { transform: scale(0.98); }
    ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    li {
      padding: 14px 16px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }
    .user-id {
      background: #0284c7;
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 User Management System</h1>
    <div class="input-group">
      <input type="text" id="username" placeholder="Enter username...">
      <button onclick="addUser()">Add User</button>
    </div>
    <ul id="userList"></ul>
  </div>

  <script>
    const API_URL = '/api/users';
    async function fetchUsers() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const list = document.getElementById('userList');
        list.innerHTML = '';
        data.forEach(user => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${user.name}</span> <span class="user-id">#${user.id}</span>`;
          list.appendChild(li);
        });
      } catch (err) { console.error('Error fetching users:', err); }
    }

    async function addUser() {
      const input = document.getElementById('username');
      const name = input.value.trim();
      if (!name) return;
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        input.value = '';
        fetchUsers();
      } catch (err) { console.error('Error adding user:', err); }
    }

    fetchUsers();
  </script>
</body>
</html>
